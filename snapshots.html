<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TabFolio — Saved snapshots</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page"><nav class="page-nav" aria-label="Navigation"><a class="brand" href="panel.html"><span class="brand-mark" aria-hidden="true">▤</span>TabFolio</a><a href="settings.html">Settings</a></nav>
<div class="page-heading"><div><div class="eyebrow">Pick up where you left off</div><h1>Saved snapshots</h1><p>Your windows, groups, and tabs, saved together. Preview a moment and restore just what you need.</p></div><button id="capture" class="primary">Take snapshot</button></div>
<div id="status" class="status" role="status" aria-live="polite" hidden></div><div id="failures" class="failure-list" hidden></div>
<div class="card storage"><div class="grow"><strong id="snapshotCount">Loading snapshots…</strong><p id="schedule" class="muted"></p></div><div><label for="storageMeter" id="storageLabel">Snapshot storage</label><br><progress id="storageMeter" value="0" max="1"></progress></div><button id="export" class="small">Export backup</button><button id="import" class="small">Import backup</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
<label class="field" for="snapshotSearch"><span class="visually-hidden">Search snapshots by date, title, site, or group</span><input id="snapshotSearch" type="search" placeholder="Search by date, title, site, or group…"></label>
<div id="snapshots"></div>
<div class="row between"><p class="muted">Restores open new windows. Only HTTP and HTTPS pages can reopen; page contents and form edits are not saved.</p><button id="clear" class="quiet danger small">Delete all snapshots</button></div>
</main><script src="core.js"></script><script src="ui.js"></script><script src="snapshots.js"></script></body></html>
